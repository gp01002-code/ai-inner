            else if (S.mode === 'collapse') gridO = 0.35 * (1 - uniforms.uRestore.value) + 0.06 * uniforms.uRestore.value;
            else if (S.mode === 'measure' || S.mode === 'ledger') gridO = 0.06 + (1 - S.level) * 0.15;
            grid.material.opacity += (gridO - grid.material.opacity) * 0.1;

            // 背景色
            if (S.mode === 'feast') bgTarget.setRGB(0.008 + 0.12 * S.heat, 0.012 + 0.02 * S.heat, 0.024 * (1 - S.heat));
            else if (S.mode === 'collapse') {
                const r = uniforms.uRestore.value;
                bgTarget.setRGB(0.03 - 0.022 * r, 0.03 - 0.018 * r, 0.03 - 0.006 * r);
            } else bgTarget.setRGB(0.008, 0.012, 0.024);
            bg.lerp(bgTarget, Math.min(1, dt * (S.mode === 'feast' ? 6 : 1.2)));
            renderer.setClearColor(bg);

            // 鏡頭
            const finishing = S.mode === 'ledger' || (S.mode === 'measure' && S.finishT > 0);
            if (finishing) {
                const a = S.mode === 'ledger' ? (now - S.ledgerStart) * 0.05 : 0;
                camBase.x += (Math.sin(a) * camDist() * 1.15 - camBase.x) * 0.02;
                camBase.z += (Math.cos(a) * camDist() * 1.15 - camBase.z) * 0.02;
                camBase.y += (90 - camBase.y) * 0.015;
            } else {
                camBase.x += (S.mouseX * 35 - camBase.x) * 0.04;
                camBase.y += (48 + S.mouseY * 20 - camBase.y) * 0.025;
                camBase.z += (camDist() - camBase.z) * 0.025;
            }
            if (!Number.isFinite(camBase.x) || !Number.isFinite(camBase.y)) camBase.set(0, 48, camDist());
            const shake = S.heat * S.heat * 7;
            camera.position.set(
                camBase.x + (Math.random() - 0.5) * shake,
                camBase.y + (Math.random() - 0.5) * shake,
                camBase.z
            );
            lookAt.y += ((finishing ? -50 : 25) - lookAt.y) * 0.015;
            camera.lookAt(lookAt);

            uniforms.uTime.value = now;
            uniforms.uHeat.value = S.mode === 'feast' ? S.heat : 0;
            uniforms.uLevel.value = (S.mode === 'measure' || S.mode === 'ledger') ? 1 - (1 - S.level) * 0.4 : S.level;
            if (S.mode === 'ledger') uniforms.uLevel.value += (1 - uniforms.uLevel.value) * uniforms.uSettle.value;

            S.audT -= dt;
            if (S.audT <= 0) { S.audT = 0.08; updateAudio(); }

            renderer.render(scene, camera);
        }

        // ---------- 輸入 ----------
        const nowS = () => performance.now() / 1000;
        // 沒有座標的事件（某些裝置或合成事件）不更新位置，避免 NaN 一路傳到鏡頭
        function setPointer(e) {
            if (!Number.isFinite(e.clientX) || !Number.isFinite(e.clientY)) return;
            S.mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            S.mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        }
        function down(e) {
            if (e.target && e.target.closest && (e.target.closest('#again') || e.target.closest('#gate'))) return;
            if (S.mode === 'gate') return;
            setPointer(e);
            if (S.mode === 'wake') {
                // 每一下都在海面上打出一圈漣漪
                raycaster.setFromCamera({ x: S.mouseX, y: S.mouseY }, camera);
                const hit = raycaster.ray.intersectPlane(oceanPlane, aimHit);
                uniforms.uRip.value[S.ripN % 4].set(hit ? aimHit.x : 0, hit ? aimHit.z : 0, clock.elapsedTime, 1);
                S.ripN++; S.wakeTaps++;
                if (audioOK) A.bells.triggerAttackRelease(eerieNote(['C4', 'F#4', 'A#4', 'D5'][S.wakeTaps % 4]), '1n', Tone.now(), 0.4);
                if (S.wakeTaps >= 3 && S.wakeEnd < 0) S.wakeEnd = clock.elapsedTime + 1.5;
                return;
            }
            const t = nowS();
            S.taps = S.taps.filter(x => t - x < 2);
            S.taps.push(t);
            S.pressAt = t;
            S.pressing = true;
        }
        function up() {
            if (S.pressing) S.releaseAt = nowS();
            S.pressing = false;
        }
        // 兩秒內按了四下以上：急躁
        const frantic = () => S.taps.filter(x => nowS() - x < 2).length >= 4;
        window.addEventListener('pointerdown', down);
        window.addEventListener('pointerup', up);
        window.addEventListener('pointercancel', up);
        window.addEventListener('blur', up);
        window.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('pointermove', setPointer);

        $('again').addEventListener('click', () => restartRound());

        // 不再顯示「開啟儲備」入口：載入後直接開始
        (function startNow() {
            const gate = $('gate');
            try {
                if (typeof THREE === 'undefined') throw new Error('Three.js 載入失敗');
                initWebGL();
                clock = new THREE.Clock();
                S.mode = 'wake'; S.modeT = 0;
                uniforms.uRip.value[0].set(0, -60, 0.8, 1);   // 第一圈漣漪，示範給你看
                S.ripN = 1;
                camBase.set(0, 260, camDist() * 1.5);
                $('canvas-container').style.opacity = 1;
                gate.classList.add('hidden');
                $('gate-note').style.opacity = 0;
                setTimeout(() => { $('ui-progress').style.opacity = 1; }, 1500);
                setText('wake');
                animate();
            } catch (e) {
                console.error('WebGL failed:', e);
                gate.style.display = 'flex';
                gate.querySelector('span').textContent = '載入失敗，點擊重試';
                gate.onclick = () => location.reload();
                return;
            }
            // 聲音需在使用者第一次觸碰或按鍵後才能啟動（瀏覽器規定）
            let audioStarted = false;
            const startAudio = async () => {
                if (audioStarted) return;
                audioStarted = true;
                try {
                    await Tone.start();
                    initAudio();
                } catch (e) {
                    console.error('Audio failed:', e);
                }
            };
            window.addEventListener('pointerdown', startAudio);
            window.addEventListener('keydown', startAudio);
        })();
    </script>
</body>
</html>
