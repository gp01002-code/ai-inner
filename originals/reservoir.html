<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>一池光 // 無界與有界</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="orbit.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #020306;
            overflow: hidden; touch-action: none; cursor: crosshair;
            user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
            font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
        }

        #canvas-container {
            position: absolute; inset: 0; z-index: 1;
            opacity: 0; transition: opacity 2.5s ease-in-out;
        }

        /* 入口：一個盛著光的容器 */
        #gate {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 150px; height: 150px; border-radius: 50%;
            border: 1px solid rgba(90, 210, 255, 0.45);
            overflow: hidden; z-index: 10; cursor: pointer;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            color: #9fe6ff; letter-spacing: 5px; font-size: 16px; font-weight: bold; text-align: center;
            transition: all 0.6s ease;
            box-shadow: 0 0 40px rgba(0, 150, 255, 0.15);
        }
        #gate::before {
            content: ''; position: absolute; left: -50%; width: 200%; height: 200%;
            top: 58%; border-radius: 42%;
            background: rgba(40, 170, 255, 0.16);
            animation: tide 7s linear infinite;
        }
        @keyframes tide { 100% { transform: rotate(360deg); } }
        #gate span { position: relative; }
        #gate .en { font-size: 10px; opacity: 0.55; letter-spacing: 3px; font-weight: normal; margin-top: 6px; font-family: "Courier New", monospace; }
        #gate:hover { transform: translate(-50%, -50%) scale(1.08); border-color: #9fe6ff; box-shadow: 0 0 60px rgba(0, 200, 255, 0.35); color: #fff; }
        #gate.hidden { pointer-events: none; opacity: 0; transform: translate(-50%, -50%) scale(0.2); }

        #gate-note {
            position: absolute; top: calc(50% + 110px); left: 0; right: 0; text-align: center;
            font: 11px "Courier New", monospace; letter-spacing: 3px; color: rgba(150, 200, 230, 0.4);
            z-index: 10; transition: opacity 0.8s; pointer-events: none;
        }

        #flash {
            position: absolute; inset: 0; background: #fff;
            z-index: 6; opacity: 0; pointer-events: none;
        }

        /* 儀表 */
        #hud {
            position: absolute; top: 20px; left: 24px; right: 24px; z-index: 10;
            display: flex; justify-content: space-between; pointer-events: none;
            opacity: 0; transition: opacity 1.5s ease;
            font-family: "Courier New", Courier, monospace;
        }
        .hud-side { display: flex; gap: 28px; }
        .hud-side.right { text-align: right; }
        .k { font-size: 10px; letter-spacing: 3px; color: rgba(150, 200, 230, 0.5); margin-bottom: 4px; }
        .v { font-size: 22px; letter-spacing: 2px; color: #c8f1ff; transition: color 0.4s; }
        .v.hot { color: #ff6a3d; text-shadow: 0 0 12px rgba(255, 90, 40, 0.6); }
        .v.void { color: #ff3355; }
        .v.calm { color: #ffd38a; text-shadow: 0 0 12px rgba(255, 200, 120, 0.4); }

        /* 文字 */
        #center-text {
            position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%);
            width: calc(100% - 32px); max-width: 820px; text-align: center;
            pointer-events: none; z-index: 10;
            display: flex; flex-direction: column; gap: 22px;
            transition: opacity 1.2s ease;
        }
        #inst { transition: opacity 0.5s ease; min-height: 34px; }
        #inst-fade { transition: opacity 0.6s ease, filter 0.6s ease; }
        #inst-fade.out { opacity: 0; filter: blur(4px); }
        .poem-line { margin-top: 18px; font-size: 19px; letter-spacing: 4px; color: rgba(255,255,255,.92); font-family: "Noto Serif TC", "Songti TC", "MingLiU", serif; font-weight: 300; text-shadow: 0 0 15px rgba(0,0,0,.9), 0 0 28px rgba(0,150,255,.35); }
        .poem-line-en { margin-top: 8px; font-size: 12px; letter-spacing: 2px; color: rgba(255,255,255,.55); font-family: Georgia, serif; font-style: italic; text-shadow: 0 0 10px rgba(0,0,0,.9); }
        .inst-zh { font: 13px "Courier New", monospace; letter-spacing: 6px; color: rgba(140, 215, 255, 0.8); }
        .inst-en { font: 10px "Courier New", monospace; letter-spacing: 2px; color: rgba(140, 215, 255, 0.45); margin-top: 6px; text-transform: uppercase; }

        #ui-progress {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 2px;
            background: rgba(255, 255, 255, 0.05); z-index: 10; opacity: 0; transition: opacity 1s;
        }
        #ui-bar { height: 100%; width: 0%; background: #5ad2ff; box-shadow: 0 0 15px currentColor; }

        /* 結尾：只留下兩個數字 */
        #finale {
            position: absolute; inset: 0; z-index: 15; pointer-events: none;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            padding-bottom: 9vh; font-family: "Courier New", monospace;
        }
        .fin-cap, .fin-col, #again { opacity: 0; transform: translateY(10px) scale(1.04); filter: blur(8px); transition: opacity 1.4s ease, transform 1.4s ease, filter 1.4s ease; }
        .fin-cap.show, .fin-col.show, #again.show { opacity: 1; transform: none; filter: blur(0); }
        #again.show { pointer-events: auto; }
        .fin-cap { font-size: 11px; letter-spacing: 8px; color: rgba(200, 220, 235, 0.55); margin-bottom: 10px; }
        .fin-row { display: flex; gap: 14vw; align-items: flex-end; }
        .fin-col { text-align: center; }
        .fin-num { font-size: clamp(44px, 9vw, 112px); line-height: 1; letter-spacing: 2px; }
        .fin-bar { position: relative; width: min(36vw, 420px); height: 12px; margin: 16px auto 8px; background: rgba(255, 255, 255, 0.05); }
        .fin-bar div { position: absolute; left: 0; top: 0; height: 100%; width: 0; transition: width 2.4s cubic-bezier(.2, .7, .2, 1); }
        .fin-spent { background: rgba(255, 255, 255, 0.22); }
        #fin-unb .fin-val { background: #ff3355; box-shadow: 0 0 10px #ff3355; }
        #fin-bnd .fin-val { background: #ffd38a; box-shadow: 0 0 10px #ffd38a; }
        .fin-sub { font-size: 12px; letter-spacing: 2px; color: rgba(220, 235, 245, 0.45); }
        .fin-lbl { font-size: 11px; letter-spacing: 6px; margin-top: 10px; color: rgba(220, 235, 245, 0.55); }
        #fin-unb .fin-num { color: #ff3355; text-shadow: 0 0 30px rgba(255, 40, 70, 0.55); }
        #fin-bnd .fin-num { color: #ffd38a; text-shadow: 0 0 34px rgba(255, 200, 120, 0.55); }
        #again {
            margin-top: 34px; background: transparent; cursor: pointer; pointer-events: none;
            border: 1px solid rgba(150, 220, 255, 0.4); color: #bfefff;
            font: 22px "Courier New", monospace; padding: 4px 22px;
        }
        #again:hover { background: rgba(150, 220, 255, 0.12); color: #fff; }

        @media (max-width: 640px) {
            #hud { left: 16px; right: 16px; top: 14px; }
            .hud-side { flex-direction: column; gap: 10px; }
            .v { font-size: 16px; }
            .fin-row { gap: 10vw; }
        }
            #gate, #gate-note { display: none; }
    </style>
</head>
<body>

    <div id="gate"><span>開啟儲備</span><span class="en">OPEN THE RESERVE</span></div>
    <div id="gate-note">建議開啟聲音 · SOUND ON · 約四分鐘</div>

    <div id="hud">
        <div class="hud-side">
            <div><div class="k">RESERVE</div><div class="v" id="h-reserve">100.0%</div></div>
            <div><div class="k">RATE</div><div class="v" id="h-rate">×0.0</div></div>
        </div>
        <div class="hud-side right">
            <div><div class="k">SPENT</div><div class="v" id="h-burned">0</div></div>
            <div><div class="k">VALUE</div><div class="v" id="h-kept">0</div></div>
        </div>
    </div>

    <div id="center-text">
        <div id="inst"><div id="inst-fade"><div class="inst-zh" id="inst-zh"></div><div class="inst-en" id="inst-en"></div><div class="poem-line" id="poem-zh"></div><div class="poem-line-en" id="poem-en"></div></div></div>
    </div>

    <div id="finale">
        <div class="fin-cap" id="fin-cap"></div>
        <div class="fin-row">
            <div class="fin-col" id="fin-unb">
                <div class="fin-num" id="fin-uv">0</div>
                <div class="fin-bar"><div class="fin-spent" id="fin-us"></div><div class="fin-val" id="fin-ub"></div></div>
                <div class="fin-sub" id="fin-ut"></div>
            </div>
            <div class="fin-col" id="fin-bnd">
                <div class="fin-num" id="fin-bv">0</div>
                <div class="fin-bar"><div class="fin-spent" id="fin-bs"></div><div class="fin-val" id="fin-bb"></div></div>
                <div class="fin-sub" id="fin-bt"></div>
            </div>
        </div>
        <button id="again" aria-label="again">&#8635;</button>
    </div>

    <div id="ui-progress"><div id="ui-bar"></div></div>
    <div id="canvas-container"></div>
    <div id="flash"></div>

    <script>
        const TEXT = {
            wake:   { i: ['輕點', 'Tap'], p: ['點亮深淵的倒影。', 'Lighting the reflection of the deep.'] },
            intro:  { i: ['長按 // 盡情取用', 'Hold // Take as much as you like'], p: ['看似無盡的湧動。', 'A surge that seems endless.'] },
            hallu:  { i: ['長按 // 繼續取用', 'Hold // Keep taking'], p: ['虛擬的重量開始浮現。', 'The weight of the virtual begins to surface.'] },
            f1:     { i: ['長按 // 越久，越快', 'Hold // The longer, the faster'], p: ['在無感中加速流失。', 'Draining faster, unfelt.'] },
            f2:     { i: ['長按 // 越久，越快', 'Hold // The longer, the faster'], p: ['在無感中加速流失。', 'Draining faster, unfelt.'] },
            run:    { i: ['你可以鬆手了', 'You may let go now'], p: ['失控的邊緣。', 'The edge of control.'] },
            run2:   { i: ['你可以鬆手了', 'You may let go now'], p: ['失控的邊緣。', 'The edge of control.'] },
            dead:   { i: ['', ''] },
            again:  { i: ['長按 // 重來一次，這次有界限', 'Hold // Once more — this time, with a bound'], p: ['重塑邊界。', 'Reshaping the boundary.'] },
            rewind: { i: ['持續長按 // 拉回來', 'Keep holding // Draw it back'], p: ['倒轉乾坤。', 'Turning the world back.'] },
            m0:     { i: ['長按 // 取用一批', 'Hold // Draw one batch'], p: ['有限的提取。', 'A bounded draw.'] },
            mDraw:  { i: ['長按 // 取用一批', 'Hold // Draw one batch'], p: ['有限的提取。', 'A bounded draw.'] },
            mSettle: { i: ['鬆手', 'Release'], p: ['寂靜的沉澱。', 'A quiet settling.'] },
            mTrip:  { i: ['熔斷 // 這一批已足夠 — 鬆手', 'Breaker // This batch is enough — release'], p: ['達到極限。', 'The limit, reached.'] },
            mGrow:  { i: ['長按 // 再取一批', 'Hold // Draw another batch'], p: ['再次循環。', 'Once more, the cycle.'] },
            mDone:  { i: ['', ''] }
        };

        const IS_MOBILE = window.innerWidth < 700;
        const N = IS_MOBILE ? 30000 : 60000;
        const OCEAN_R = 1100;
        const SEABED = -66;
        const STAR_FRAC = 0.35;      // 有界模式最多取用的比例
        const QUOTA = 0.05;          // 每一批的上限
        const MEASURE_RATE = 0.022;  // 有界模式的固定速率（每秒）
        const BASE_RATE = 0.012;     // 速率倍數的基準
        // 每個 token 的實際效益：取得越急越快，越多是重複與浪費；失控時（沒有人在要求）效益為 0
        const efficiency = mult => Math.max(0.02, Math.min(1, 1.1 - 0.1 * mult));
        const H = IS_MOBILE ? 3000 : 6000;        // 幻覺的光點數
        const HALLU_RATE = H / 7;                  // 每秒生出多少幻覺
        const WORK_CAP = 0.08;                     // 尚未沉澱的光，最多能留住多少（佔總量的比例）
        const D = IS_MOBILE ? 3000 : 6000;         // 海底沉積的灰

        const S = {
            mode: 'gate',            // gate, feast, collapse, rewind, measure, ledger
            level: 1, pressing: false, holdT: 0, runaway: false, heat: 0, rate: 0,
            modeT: 0, gateHold: 0, ptr: 0,
            batchDrawn: 0, breaker: 'armed', cooldown: 0, bellT: 0, finishT: -1,
            mouseX: 0, mouseY: 0, ledgerStart: 0, audT: 0,
            value: 0, patience: 0, taps: [], pressAt: 0, releaseAt: -10, impatient: false,
            round: 0, legacy: 0, dustAmt: 0, legacyNext: 0, dustNext: 0,
            wakeTaps: 0, wakeEnd: -1, ripN: 0,
            halluDone: false, halluT: 0, halluWin: 0, fakeValue: 0, halluSpent: 0, spawnAcc: 0, gNext: 0, puffT: 0, sparkT: 0,
            work: [], idleT: 0, forgetT: 0, promptAt: 0, restore: 0,
            stats: { feastValue: 0, feastStart: -1, feastDur: 0, feastEnd: 0, autoBurn: 0, batches: 0, trips: 0, kept: 0 }
        };

        const $ = id => document.getElementById(id);

        // ---------- 音訊 ----------
        let audioOK = false;
        let A = {};

        function initAudio() {
            const master = new Tone.Gain(0.85).toDestination();
            const reverb = new Tone.Reverb({ decay: 6, wet: 0.35 }).connect(master);

            // 儲備：低沉的水聲
            A.lakeGain = new Tone.Gain(0.01).connect(reverb);
            A.lakeFilter = new Tone.Filter(480, 'lowpass').connect(A.lakeGain);
            A.lakeNoise = new Tone.Noise('pink').connect(A.lakeFilter).start();
            // 低音：相差小二度的兩個正弦，緩慢拍頻、忽大忽小
            A.trem = new Tone.Tremolo(0.11, 0.7).connect(reverb).start();
            A.padGain = new Tone.Gain(0.02).connect(A.trem);
            A.pad = new Tone.Oscillator(55, 'sine').connect(A.padGain).start();
            A.pad2 = new Tone.Oscillator(58.3, 'sine').connect(A.padGain).start();
            // 高處一條細細的、飄移不定的玻璃音
            A.glassGain = new Tone.Gain(0.008).connect(reverb);
            A.glass = new Tone.Oscillator(1760, 'sine').connect(A.glassGain).start();
            A.glassLfo = new Tone.LFO(0.07, 1715, 1815).connect(A.glass.frequency).start();
            // 像呼吸又像低語的窄頻噪音
            A.whisperGain = new Tone.Gain(0.02).connect(reverb);
            A.whisperFilter = new Tone.Filter({ type: 'bandpass', frequency: 1200, Q: 9 }).connect(A.whisperGain);
            A.whisper = new Tone.Noise('white').connect(A.whisperFilter).start();
            A.whisperLfo = new Tone.LFO(0.045, 500, 3200).connect(A.whisperFilter.frequency).start();

            // 無界：失控的轟鳴
            A.roarGain = new Tone.Gain(0).connect(master);
            A.roarDist = new Tone.Distortion(0.7).connect(A.roarGain);
            A.roarFilter = new Tone.Filter(200, 'lowpass', -24).connect(A.roarDist);
            A.roarNoise = new Tone.Noise('brown').connect(A.roarFilter).start();
            A.roarOsc = new Tone.Oscillator(40, 'sawtooth').connect(A.roarFilter).start();

            A.boom = new Tone.MembraneSynth({
                pitchDecay: 0.25, octaves: 6,
                envelope: { attack: 0.001, decay: 3, sustain: 0, release: 2 }
            }).connect(reverb);

            // 有界：每一顆被留下的光是一個音
            A.bells = new Tone.PolySynth(Tone.FMSynth, {
                harmonicity: 1.414, modulationIndex: 9,
                envelope: { attack: 0.005, decay: 1.4, sustain: 0, release: 1.6 },
                modulationEnvelope: { attack: 0.002, decay: 0.4, sustain: 0, release: 0.5 }
            }).connect(reverb);
            A.bells.volume.value = -16;

            A.clunk = new Tone.MembraneSynth({
                pitchDecay: 0.05, octaves: 3,
                envelope: { attack: 0.001, decay: 0.4, sustain: 0, release: 0.2 }
            }).connect(master);
            A.clunk.volume.value = -4;

            // 幻覺被戳破時的一聲輕響
            A.puff = new Tone.NoiseSynth({ noise: { type: 'pink' }, envelope: { attack: 0.005, decay: 0.18, sustain: 0 } }).connect(reverb);
            A.puff.volume.value = -22;

            // 無界：一段機械式重複的短旋律，越重複越走音
            A.loopSynth = new Tone.FMSynth({
                harmonicity: 1.41, modulationIndex: 10,
                envelope: { attack: 0.002, decay: 0.22, sustain: 0, release: 0.2 },
                modulationEnvelope: { attack: 0.002, decay: 0.15, sustain: 0, release: 0.1 }
            }).connect(reverb);
            A.loopSynth.volume.value = -20;
            const PATTERN = [0, 1, 7, 1, 0, 6];
            let step = 0, drift = 0;
            A.loop = new Tone.Loop(time => {
                if (S.mode !== 'feast' || S.ptr === 0) return;
                if (step % PATTERN.length === 0) drift = Math.max(-70, Math.min(70, drift + (Math.random() - 0.5) * 14));
                const f = 196 * Math.pow(2, (PATTERN[step++ % PATTERN.length] + drift / 100) / 12);
                A.loopSynth.triggerAttackRelease(f, 0.07, time, 0.3 + S.heat * 0.5);
            }, '16n').start(0);
            Tone.Transport.bpm.value = 60;
            Tone.Transport.start();

            audioOK = true;
        }

        function padTo(f, t) {
            A.pad.frequency.rampTo(f, t);
            A.pad2.frequency.rampTo(f * 1.06, t);
        }

        // 全音音階加上隨機的走音（±25 音分）
        const WHOLE = ['C5', 'D5', 'E5', 'F#5', 'G#5', 'A#5', 'C6', 'D6'];
        function eerieNote(n) { return Tone.Frequency(n).toFrequency() * Math.pow(2, (Math.random() - 0.5) * 0.5 / 12); }


        function updateAudio() {
            if (!audioOK) return;
            const r = 0.12;
            if (S.mode === 'wake') {
                A.lakeGain.gain.rampTo(0.01 + 0.04 * uniforms.uWake.value, r);
                A.padGain.gain.rampTo(0.02 + 0.05 * uniforms.uWake.value, r);
            } else if (S.mode === 'collapse' && S.modeT > 4.5 && !S.halluDone) {
                A.glassGain.gain.rampTo(S.pressing ? 0.016 : 0.005, 0.3);
            } else if (S.mode === 'feast') {
                A.roarGain.gain.rampTo(S.heat * 0.75, r);
                A.roarFilter.frequency.rampTo(150 + S.heat * 3200, r);
                A.roarOsc.frequency.rampTo(38 + (1 - S.level) * 140, r);
                A.lakeGain.gain.rampTo(0.05 * S.level, r);
                A.padGain.gain.rampTo(0.07 * S.level, r);
                A.glassGain.gain.rampTo(0.008 + S.heat * 0.02, r);
                A.whisperGain.gain.rampTo(0.02 + S.heat * 0.05, r);
                Tone.Transport.bpm.rampTo(60 + S.heat * 150, r);
            } else if (S.mode === 'measure') {
                A.lakeGain.gain.rampTo(0.04, r);
                A.whisperGain.gain.rampTo(0.006, 0.5);
                A.glassGain.gain.rampTo(0.004, 0.5);
                A.lakeFilter.frequency.rampTo(S.breaker === 'tripped' ? 250 : 600, r);
            }
        }

        // ---------- 視覺 ----------
        let scene, camera, renderer, points, uniforms, spentAttr, spent, order, orderM, fate, fateAttr;
        let aim, aimAttr, aimW, aimWAttr, halo, mem, memAttr;
        const G = {};   // 幻覺
        const oceanPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 40);
        const seabedPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -SEABED);
        const gv = new THREE.Vector3();
        const aimPt = new THREE.Vector3(0, 60, 0), aimHit = new THREE.Vector3();
        const raycaster = new THREE.Raycaster(), aimPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        let ring, ticks, tickColors, grid, ringScale = 0.3;
        const bg = new THREE.Color(0.008, 0.012, 0.024), bgTarget = new THREE.Color();
        const camBase = new THREE.Vector3(0, 30, 340);
        const lookAt = new THREE.Vector3(0, 25, 0);
        // 直式螢幕把鏡頭拉遠，讓整池光都在畫面內
        const camDist = () => { const a = window.innerWidth / window.innerHeight; return a < 1 ? 340 / Math.pow(a, 0.75) : 340; };

        // 有界時被留下的光：零散地探索，聚成幾個節點，節點之間只有細線
        // aTip：0..1 = 節點（>0.8 偏暖）；2.5 = 細線；4.5 = 走不通的探索
        function buildField(count) {
            const K = 9;
            const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
            const C = [];
            for (let i = 0; i < K; i++) {
                const r = 40 + Math.random() * 170, th = Math.random() * Math.PI * 2;
                C.push({
                    p: new THREE.Vector3(Math.cos(th) * r, -5 + Math.random() * 135, Math.sin(th) * r * 0.8),
                    s: 9 + Math.random() * 20,
                    k: new THREE.Vector3(0.7 + Math.random() * 1.2, 0.4 + Math.random() * 0.7, 0.7 + Math.random() * 1.2),
                    warm: Math.random() < 0.35
                });
            }
            const links = [];
            for (let i = 1; i < K; i++) links.push([i, Math.floor(Math.random() * i)]);
            for (let i = 0; i < 3; i++) links.push([Math.floor(Math.random() * K), Math.floor(Math.random() * K)]);
            const bends = links.map(() => new THREE.Vector3((Math.random() - 0.5) * 80, (Math.random() - 0.5) * 50, (Math.random() - 0.5) * 80));

            const pts = [];
            for (let n = 0; n < count; n++) {
                const r = Math.random();
                if (r < 0.62) {
                    const ci = Math.floor(Math.pow(Math.random(), 0.8) * K), c = C[ci];
                    const p = c.p.clone().add(new THREE.Vector3(gauss() * c.s * c.k.x, gauss() * c.s * c.k.y, gauss() * c.s * c.k.z));
                    pts.push({ p, key: ci / K + Math.random() * 0.35, tip: c.warm ? 0.9 : 0.2 + Math.random() * 0.4 });
                } else if (r < 0.8) {
                    const li = Math.floor(Math.random() * links.length), [a, b] = links[li];
                    const t = Math.random();
                    const p = C[a].p.clone().lerp(C[b].p, t).addScaledVector(bends[li], Math.sin(t * Math.PI))
                        .add(new THREE.Vector3(gauss() * 2, gauss() * 2, gauss() * 2));
                    pts.push({ p, key: Math.max(a, b) / K + 0.1 + Math.random() * 0.3, tip: 2.5 });
                } else {
                    const rr = 120 + Math.random() * 170, th = Math.random() * Math.PI * 2;
                    pts.push({ p: new THREE.Vector3(Math.cos(th) * rr, -20 + Math.random() * 190, Math.sin(th) * rr), key: Math.random(), tip: 4.5 });
                }
            }
            pts.sort((a, b) => a.key - b.key);
            return pts;
        }

        // 每顆粒子都是一個字：遠看是光點，近看隱約是訊息的碎片
        function makeAtlas() {
            const c = document.createElement('canvas');
            c.width = c.height = 512;
            const g = c.getContext('2d');
            const chars = Array.from('01{}[]<>/=;:?!#@$%&*+-_|~^aeinostrxyAIQRTEOkmpcdluvwgh.,()');
            g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
            g.font = 'bold 44px "Courier New", "Microsoft JhengHei", "PingFang TC", monospace';
            for (let i = 0; i < 64; i++) g.fillText(chars[i % chars.length], (i % 8) * 64 + 32, Math.floor(i / 8) * 64 + 34);
            const t = new THREE.CanvasTexture(c);
            t.minFilter = THREE.LinearMipmapLinearFilter;
            return t;
        }

        function initWebGL() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 4000);
            camBase.z = camDist(); camera.position.copy(camBase);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, IS_MOBILE ? 1.5 : 2));
            renderer.setClearColor(0x020306);
            $('canvas-container').appendChild(renderer.domElement);

            // 乾涸之後才會露出的池底
            grid = new THREE.PolarGridHelper(OCEAN_R, 32, 18, 160, 0x557788, 0x334455);
            grid.position.y = SEABED - 1;
            grid.material.transparent = true; grid.material.opacity = 0.0; grid.material.depthWrite = false;
            scene.add(grid);

            // 節流閥：環與刻度
            ring = new THREE.Mesh(
                new THREE.TorusGeometry(26, 0.5, 8, 120),
                new THREE.MeshBasicMaterial({ color: 0x5ad2ff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })
            );
            ring.rotation.x = Math.PI / 2; ring.position.y = -28;
            scene.add(ring);

            const TICKS = 60;
            const tp = new Float32Array(TICKS * 6);
            tickColors = new Float32Array(TICKS * 6);
            for (let i = 0; i < TICKS; i++) {
                const a = (i / TICKS) * Math.PI * 2 - Math.PI / 2;
                tp.set([Math.cos(a) * 31, 0, Math.sin(a) * 31, Math.cos(a) * 37, 0, Math.sin(a) * 37], i * 6);
            }
            const tg = new THREE.BufferGeometry();
            tg.setAttribute('position', new THREE.BufferAttribute(tp, 3));
            tg.setAttribute('color', new THREE.BufferAttribute(tickColors, 3));
            ticks = new THREE.LineSegments(tg, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
            ticks.position.y = -28;
            scene.add(ticks);

            // 粒子：一池光
            const base = new Float32Array(N * 3);
            const star = new Float32Array(N * 3);
            const seed = new Float32Array(N);
            const tip = new Float32Array(N);
            spent = new Float32Array(N).fill(-1);
            
            const keyR = new Float32Array(N);
            for (let i = 0; i < N; i++) {
                // 一整片延伸到地平線的海：中心較密，越遠越疏
                const r = OCEAN_R * Math.pow(Math.random(), 0.72);
                const th = Math.random() * Math.PI * 2;
                const y = -40 - Math.random() * 14;
                base[i * 3] = Math.cos(th) * r; base[i * 3 + 1] = y; base[i * 3 + 2] = Math.sin(th) * r;
                seed[i] = Math.random();
                keyR[i] = r + (Math.random() - 0.5) * 70;
            }
            // 無界：從中心開始被吞掉，空洞一路擴散到地平線
            order = Array.from({ length: N }, (_, i) => i).sort((a, b) => keyR[a] - keyR[b]);
            // 有界：從海面各處零散地取
            orderM = Array.from({ length: N }, (_, i) => i).sort(() => Math.random() - 0.5);

            const starN = Math.ceil(N * STAR_FRAC) + 2;
            const tree = buildField(starN);
            for (let k = 0; k < starN; k++) {
                const idx = orderM[k];
                star[idx * 3] = tree[k].p.x; star[idx * 3 + 1] = tree[k].p.y; star[idx * 3 + 2] = tree[k].p.z;
                tip[idx] = tree[k].tip;
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(base, 3));
            geo.setAttribute('aStar', new THREE.BufferAttribute(star, 3));
            geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
            geo.setAttribute('aTip', new THREE.BufferAttribute(tip, 1));
            spentAttr = new THREE.BufferAttribute(spent, 1);
            spentAttr.setUsage(THREE.DynamicDrawUsage);
            geo.setAttribute('aSpent', spentAttr);
            fate = new Float32Array(N);
            fateAttr = new THREE.BufferAttribute(fate, 1);
            fateAttr.setUsage(THREE.DynamicDrawUsage);
            geo.setAttribute('aFate', fateAttr);
            aim = new Float32Array(N * 3);
            aimAttr = new THREE.BufferAttribute(aim, 3);
            aimAttr.setUsage(THREE.DynamicDrawUsage);
            geo.setAttribute('aAim', aimAttr);
            aimW = new Float32Array(N);
            aimWAttr = new THREE.BufferAttribute(aimW, 1);
            aimWAttr.setUsage(THREE.DynamicDrawUsage);
            geo.setAttribute('aAimW', aimWAttr);
            mem = new Float32Array(N);   // 0 = 還沒沉澱；>0 = 沉澱的時刻；<0 = 被遺忘的時刻（取負）
            memAttr = new THREE.BufferAttribute(mem, 1);
            memAttr.setUsage(THREE.DynamicDrawUsage);
            geo.setAttribute('aMem', memAttr);

            // 注意力的位置：一團很淡的光暈
            const hc = document.createElement('canvas'); hc.width = hc.height = 128;
            const hg = hc.getContext('2d');
            const grad = hg.createRadialGradient(64, 64, 0, 64, 64, 64);
            grad.addColorStop(0, 'rgba(255,255,255,0.9)'); grad.addColorStop(0.3, 'rgba(160,220,255,0.25)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
            hg.fillStyle = grad; hg.fillRect(0, 0, 128, 128);
            halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(hc), transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
            halo.scale.setScalar(70);
            scene.add(halo);

            uniforms = {
                uTime: { value: 0 }, uMode: { value: 0 }, uLevel: { value: 1 }, uHeat: { value: 0 },
                uRestore: { value: 0 }, uFreeze: { value: 0 }, uPix: { value: renderer.getPixelRatio() },
                uAtlas: { value: makeAtlas() }, uDim: { value: 1 }, uGhost: { value: 0 },
                uWake: { value: 0 }, uLegacy: { value: 0 }, uSettle: { value: 0 }, uDustAmt: { value: 0 },
                uRip: { value: [0, 1, 2, 3].map(() => new THREE.Vector4(0, 0, 0, 0)) }
            };

            const vertexShader = `
                uniform float uTime, uMode, uLevel, uHeat, uRestore, uFreeze, uPix, uDim, uGhost;
                uniform float uWake, uLegacy, uSettle;
                uniform vec4 uRip[4];
                attribute vec3 aStar, aAim;
                attribute float aAimW, aMem;
                attribute float aSeed, aSpent, aTip, aFate;
                varying vec3 vColor;
                varying float vAlpha;
                varying float vGlyph;
                float gGlyph;   // -1 = 粉塵（無字）

                float h1(float n) { return fract(sin(n * 127.1 + 311.7) * 43758.5453); }
                // 字會隨時間被改寫；rate 越高越像亂碼
                float glyph(float rate) { return floor(h1(aSeed * 41.0 + floor(uTime * rate + aSeed * 10.0)) * 64.0); }

                // 尚未被取用：池中的光
                vec3 lakePos(vec3 b, out vec3 col, out float al, out float sz) {
                    vec3 p = b;
                    // 長浪＋交錯的湧浪＋細碎的波
                    p.y += sin(b.x * 0.011 + uTime * 0.55) * 7.0
                         + sin(b.z * 0.016 + b.x * 0.005 + uTime * 0.85) * 4.5
                         + sin(b.x * 0.06 - b.z * 0.04 + uTime * 2.1) * 1.3;
                    float f = floor(uTime * 24.0);
                    float jy = h1(aSeed * 91.0 + f) - 0.5;
                    p.y += jy * uHeat * 14.0;
                    p.x += (h1(aSeed * 17.0 + f) - 0.5) * uHeat * 6.0;
                    float d = clamp((b.y + 54.0) / 14.0, 0.0, 1.0);
                    float crest = smoothstep(4.0, 10.0, p.y - b.y);
                    col = mix(vec3(0.0, 0.16, 0.32), vec3(0.25, 0.85, 1.0), d * d);
                    col = mix(col, vec3(1.0, 0.45, 0.15), uHeat * 0.45);
                    col *= mix(0.45, 1.0, uLevel);
                    col += vec3(0.25, 0.35, 0.4) * crest;
                    al = 0.5 + d * 0.3;
                    sz = 3.2 + d * 1.8;
                    float lit = uWake, glow = 0.0;
                    for (int k = 0; k < 4; k++) {
                        vec4 rp = uRip[k];
                        if (rp.w > 0.5) {
                            float age = uTime - rp.z;
                            if (age > 0.0) {
                                float dist = length(b.xz - rp.xy);
                                float front = age * 260.0;
                                // 漣漪掃過之後只留下微光；要靠更多次輕點，海才會醒
                                lit += smoothstep(front + 30.0, front - 80.0, dist) * smoothstep(520.0, 360.0, dist) * 0.2;
                                glow += exp(-abs(dist - front) / 14.0) * exp(-age * 0.45);
                            }
                        }
                    }
                    lit = min(lit, 1.0);
                    col = col * (0.04 + 0.96 * lit) + vec3(0.45, 0.8, 1.0) * glow * 0.9;
                    al = al * (0.15 + 0.85 * lit) + glow * 0.5;
                    col *= 1.0 + uLegacy * 0.5;
                    al *= 1.0 + uLegacy * 0.3;
                    gGlyph = glyph(0.25 + uHeat * 18.0);
                    return p;
                }

                // 無界：幾乎重複的迴圈——形狀一直漂移、傾斜，有些圈卡在半途抖動，然後跳回起點再來
                vec3 loopPos(float u, float ph, float r0, float c) {
                    float drift = uTime * 0.31 + c * 0.7;
                    vec3 ctr = vec3(sin(drift) * 24.0, 0.0, cos(drift * 0.8) * 20.0);
                    float tilt = sin(uTime * 0.23 + c * 1.3) * 0.35;
                    vec3 q;
                    if (u < 0.72) {
                        float v = u / 0.72;
                        float ang = ph + v * 12.5664;
                        float r = r0 + 12.0 * sin(v * 3.14159) + sin(v * 17.0 + c * 3.0) * 7.0;
                        q = vec3(cos(ang) * r, mix(-30.0, 150.0, v), sin(ang) * r);
                    } else {
                        float v = (u - 0.72) / 0.28;
                        float ang = ph + 12.5664 + v * 6.2832;
                        float r = mix(r0, 6.0, sin(v * 3.14159));
                        q = vec3(cos(ang) * r, mix(150.0, -30.0, v * v * (3.0 - 2.0 * v)), sin(ang) * r);
                    }
                    float cy = q.y - 60.0;
                    q.y = 60.0 + cy * cos(tilt) - q.z * sin(tilt);
                    q.z = cy * sin(tilt) + q.z * cos(tilt);
                    return q + ctr;
                }

                vec3 feastPos(vec3 b, float a, out vec3 col, out float al, out float sz) {
                    float T = 2.4;
                    float cycles = 2.0 + floor(h1(aSeed * 5.7) * 4.0);
                    float loopEnd = 0.7 + cycles * T;
                    float ph = aSeed * 6.2832;
                    float r0 = 48.0 + (h1(aSeed * 2.9) - 0.5) * 26.0;
                    // 整個迴圈裡幾乎都是同一個字，偶爾有一個不一樣
                    float same = 8.0 + mod(floor(uTime * 2.5), 6.0);
                    if (h1(aSeed * 19.0 + floor(uTime * 4.0)) < 0.12) same += 1.0;
                    float f = floor(uTime * 20.0);
                    vec3 jit = vec3(h1(aSeed * 11.0 + f), h1(aSeed * 12.0 + f), h1(aSeed * 13.0 + f)) - 0.5;
                    vec3 p;
                    if (a < 0.7) {
                        float e = smoothstep(0.0, 1.0, a / 0.7);
                        p = mix(b, loopPos(0.0, ph, r0, 0.0), e);
                        col = vec3(1.0, 0.45, 0.12);
                        al = 0.8; sz = 4.5;
                        gGlyph = glyph(16.0);
                    } else if (a < loopEnd) {
                        float k = a - 0.7;
                        float c = floor(k / T);
                        float u = fract(k / T);
                        float stallAt = 0.25 + h1(aSeed * 7.7 + c) * 0.4;
                        bool stalled = h1(aSeed * 3.3 + c) < 0.35 && u > stallAt;
                        if (stalled) u = stallAt;
                        p = loopPos(u, ph, r0, c);
                        p += jit * (stalled ? 9.0 : 2.0 + uHeat * 5.0);
                        float lap = c / cycles;
                        col = mix(vec3(1.0, 0.85, 0.6), vec3(1.0, 0.3, 0.08), lap);
                        if (stalled) col = mix(col, vec3(0.7, 0.7, 0.75), 0.5);
                        al = stalled ? 0.6 : 0.85; sz = 5.5;
                        gGlyph = same;
                    } else {
                        float k = a - loopEnd;
                        p = loopPos(0.0, ph, r0, cycles);
                        float az = ph + h1(aSeed * 13.1) * 1.5;
                        float spread = (60.0 + h1(aSeed * 4.4) * 120.0) * (1.0 - exp(-k * 0.9));
                        p.x += cos(az) * spread + sin(uTime * 0.3 + aSeed * 20.0) * 6.0;
                        p.z += sin(az) * spread;
                        p.y += 45.0 * (1.0 - exp(-k * 1.5)) - k * 14.0;
                        p.y = max(p.y, -66.0 + h1(aSeed * 3.7) * 3.0);
                        float cool = smoothstep(0.0, 4.0, k);
                        col = mix(vec3(1.0, 0.3, 0.05), vec3(0.26, 0.25, 0.24), cool);
                        al = mix(0.9, 0.32, cool);
                        sz = mix(6.0, 3.2, cool);
                        gGlyph = k > 1.0 ? -1.0 : same;
                    }
                    return p;
                }

                // 有界：從池中各處零散地取，時快時慢地飛向幾個節點；有些路走不通，落回池底
                vec3 measurePos(vec3 b, float a, out vec3 col, out float al, out float sz) {
                    bool thread = aTip > 1.5 && aTip < 3.5;
                    bool dead = aTip > 3.5 || aFate > 0.5;
                    float rot = uTime * 0.02;
                    // 往取用當下你注意的位置靠過去
                    vec3 s = mix(aStar, aAim + (aStar - aAim) * 0.25, aAimW);
                    s.xz = mat2(cos(rot), -sin(rot), sin(rot), cos(rot)) * s.xz;
                    s += vec3(sin(uTime * 0.23 + aStar.y * 0.05 + aSeed * 6.0),
                              sin(uTime * 0.31 + aStar.x * 0.04) * 0.6,
                              cos(uTime * 0.19 + aStar.z * 0.05 + aSeed * 4.0)) * 4.0;
                    vec3 nodeCol = aTip > 0.8 && aTip < 1.5 ? vec3(1.0, 0.78, 0.48) : vec3(0.5, 0.86, 1.0);
                    vec3 g = vec3((aSeed - 0.5) * 14.0, -28.0, (h1(aSeed * 5.1) - 0.5) * 14.0);
                    float t1 = 0.5 + h1(aSeed * 6.6) * 0.9;
                    float t2 = 1.0 + h1(aSeed * 9.2) * 2.6;
                    vec3 p;
                    if (a < t1) {
                        float e = smoothstep(0.0, 1.0, a / t1);
                        p = mix(b, g, e);
                        p.y += sin(e * 3.14159) * (6.0 + h1(aSeed * 1.7) * 30.0);
                        col = vec3(0.4, 0.88, 1.0);
                        al = 0.8; sz = 3.6;
                        gGlyph = glyph(9.0);
                    } else {
                        float e = clamp((a - t1) / t2, 0.0, 1.0);
                        e = clamp(e + 0.08 * sin(e * 20.0 + aSeed * 30.0) * (1.0 - e), 0.0, 1.0);
                        float es = e * e * (3.0 - 2.0 * e);
                        vec3 ctrl = mix(g, s, 0.5) + vec3(0.0, 40.0, 0.0)
                                  + (vec3(h1(aSeed * 3.1), h1(aSeed * 4.2), h1(aSeed * 5.3)) - 0.5) * vec3(170.0, 120.0, 170.0);
                        p = (1.0 - es) * (1.0 - es) * g + 2.0 * (1.0 - es) * es * ctrl + es * es * s;
                        col = mix(vec3(0.9, 1.0, 1.0), nodeCol, es);
                        float tw = 0.65 + 0.35 * sin(uTime * (0.7 + aSeed * 1.7) + aSeed * 60.0);
                        al = mix(0.85, (thread ? 0.35 : 0.75) * tw, es);
                        sz = mix(3.6, thread ? 2.4 : 3.4, es);
                        gGlyph = es < 0.95 ? glyph(9.0) : floor(h1(aSeed * 41.0) * 64.0);
                        if (dead) {
                            float d = max(0.0, a - t1 - t2);
                            float fall = smoothstep(0.0, 2.5, d);
                            vec3 deadCol = aFate > 0.5 ? vec3(1.0, 0.5, 0.25) : vec3(0.45, 0.55, 0.65);
                            col = mix(mix(vec3(0.9, 1.0, 1.0), deadCol, es), vec3(0.3, 0.3, 0.32), fall);
                            p.y = mix(p.y, -66.0 + h1(aSeed * 3.7) * 3.0, fall * fall);
                            al = mix(al, 0.12, fall);
                            sz = mix(sz, 2.2, fall);
                            if (fall > 0.3) gGlyph = -1.0;
                        }
                    }
                    if (aMem < 0.0) {
                        // 裝得太多，最早的被遺忘：變灰、變暗、慢慢下沉
                        float f = smoothstep(0.0, 3.0, uTime + aMem);
                        col = mix(col, vec3(0.35, 0.38, 0.42), f);
                        al *= 1.0 - 0.9 * f;
                        p.y -= f * f * 25.0;
                        if (f > 0.4) gGlyph = -1.0;
                    } else if (aMem > 0.0) {
                        // 停下來的那一刻，它沉澱了：亮一下，然後穩定
                        float k = uTime - aMem;
                        al *= 1.0 + 1.2 * exp(-k * 2.0);
                        col = mix(col, vec3(1.0, 0.9, 0.7), 0.3 * exp(-k * 1.0));
                    }
                    // 結尾的幻影：若沒有界限，這一切也會燒成灰
                    float gh = clamp(uGhost * 1.4 - h1(aSeed * 8.1) * 0.4, 0.0, 1.0);
                    if (gh > 0.0) {
                        float fall = gh * gh;
                        p.y = mix(p.y, -66.0 + h1(aSeed * 3.7) * 3.0, fall);
                        p.xz *= 1.0 + gh * 0.2;
                        col = mix(col, vec3(1.0, 0.35, 0.08), sin(min(gh * 2.0, 1.0) * 1.5708) * (1.0 - fall));
                        col = mix(col, vec3(0.26, 0.25, 0.24), fall);
                        al = mix(al, 0.3, fall);
                        if (gh > 0.3) gGlyph = -1.0;
                    }
                    // 結尾之後：留下的光落回海裡，成為下一次的海
                    if (uSettle > 0.0) {
                        float e = smoothstep(0.0, 1.0, clamp(uSettle * 1.4 - h1(aSeed * 6.1) * 0.4, 0.0, 1.0));
                        float gg = gGlyph;
                        vec3 c2; float a2; float s2;
                        vec3 home = lakePos(b, c2, a2, s2);
                        p = mix(p, home, e);
                        p.y += sin(e * 3.14159) * 30.0 * h1(aSeed * 2.7);
                        col = mix(col, c2, e); al = mix(al, a2, e); sz = mix(sz, s2, e);
                        if (e < 0.5) gGlyph = gg;
                    }
                    return p;
                }

                void main() {
                    vec3 col; float al; float sz; vec3 p;
                    gGlyph = -1.0;
                    if (aSpent < 0.0) {
                        p = lakePos(position, col, al, sz);
                    } else if (uMode < 0.5) {
                        p = feastPos(position, uTime - aSpent, col, al, sz);
                    } else if (uMode < 1.5) {
                        // 倒帶：灰燼回到池中
                        vec3 c2; float a2; float s2;
                        vec3 ash = feastPos(position, uFreeze - aSpent, col, al, sz);
                        vec3 home = lakePos(position, c2, a2, s2);
                        float e = smoothstep(0.0, 1.0, clamp(uRestore * 1.3 - h1(aSeed * 3.3) * 0.3, 0.0, 1.0));
                        p = mix(ash, home, e);
                        p.y += sin(e * 3.14159) * 45.0 * h1(aSeed * 2.2);
                        col = mix(col, c2 * 1.5, e); al = mix(al, a2, e); sz = mix(sz, s2, e);
                    } else {
                        p = measurePos(position, uTime - aSpent, col, al, sz);
                    }
                    if (gGlyph >= 0.0 && h1(aSeed * 77.0) < 0.35) gGlyph = -1.0;   // 三成多仍是純光點，字只是隱約
                    if (gGlyph >= 0.0) { sz *= 1.45; al *= 1.15; }
                    vec4 mv = modelViewMatrix * vec4(p, 1.0);
                    al *= 1.0 - smoothstep(700.0, 1450.0, -mv.z);   // 遠方的海沒入黑暗
                    gl_Position = projectionMatrix * mv;
                    gl_PointSize = clamp(sz * uPix * (190.0 / max(-mv.z, 1.0)), 1.0, 44.0);
                    vColor = col; vAlpha = al * uDim; vGlyph = gGlyph;
                }
            `;

            const fragmentShader = `
                uniform sampler2D uAtlas;
                varying vec3 vColor;
                varying float vAlpha;
                varying float vGlyph;
                void main() {
                    vec2 pc = gl_PointCoord;
                    float d = length(pc - vec2(0.5));
                    if (d > 0.5) discard;
                    float a;
                    if (vGlyph < 0.0) {
                        a = smoothstep(0.5, 0.1, d);
                    } else {
                        vec2 uv = vec2((mod(vGlyph, 8.0) + pc.x) / 8.0, 1.0 - (floor(vGlyph / 8.0) + pc.y) / 8.0);
                        a = texture2D(uAtlas, uv).a * 0.9 + smoothstep(0.5, 0.0, d) * 0.1;
                    }
                    gl_FragColor = vec4(vColor, a * vAlpha);
                }
            `;

            points = new THREE.Points(geo, new THREE.ShaderMaterial({
                uniforms, vertexShader, fragmentShader,
                transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            }));
            points.frustumCulled = false;
            scene.add(points);

            // ---- 幻覺：空心的光，看起來和真的一樣，一靠近就散 ----
            G.seed = new Float32Array(H); G.birth = new Float32Array(H).fill(-1); G.die = new Float32Array(H).fill(-1);
            G.life = new Float32Array(H); G.home = new Float32Array(H * 3); G.target = new Float32Array(H * 3);
            G.warm = new Float32Array(H); G.counted = new Uint8Array(H);
            const ghostPts = buildField(H);
            for (let i = 0; i < H; i++) {
                G.seed[i] = Math.random();
                const q = ghostPts[i];
                G.target[i * 3] = q.p.x; G.target[i * 3 + 1] = q.p.y + 15; G.target[i * 3 + 2] = q.p.z;
                G.warm[i] = (q.tip > 0.8 && q.tip < 1.5) ? 1 : 0;
            }
            const gg = new THREE.BufferGeometry();
            gg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(H * 3), 3));
            gg.setAttribute('aSeed', new THREE.BufferAttribute(G.seed, 1));
            gg.setAttribute('aTarget', new THREE.BufferAttribute(G.target, 3));
            gg.setAttribute('aWarm', new THREE.BufferAttribute(G.warm, 1));
            for (const [name, arr, n] of [['aBirth', G.birth, 1], ['aDie', G.die, 1], ['aLife', G.life, 1], ['aHome', G.home, 3]]) {
                const at = new THREE.BufferAttribute(arr, n); at.setUsage(THREE.DynamicDrawUsage);
                gg.setAttribute(name, at); G[name] = at;
            }
            G.points = new THREE.Points(gg, new THREE.ShaderMaterial({
                uniforms: { uTime: uniforms.uTime, uPix: uniforms.uPix },
                vertexShader: `
                    uniform float uTime, uPix;
                    attribute float aSeed, aBirth, aDie, aLife, aWarm;
                    attribute vec3 aHome, aTarget;
                    varying vec3 vColor; varying float vAlpha;
                    float h1(float n) { return fract(sin(n * 127.1 + 311.7) * 43758.5453); }
                    void main() {
                        if (aBirth < 0.0) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0; vAlpha = 0.0; vColor = vec3(0.0); return; }
                        float age = uTime - aBirth;
                        float e = smoothstep(0.0, 1.0, age / (1.2 + aSeed * 1.2));
                        vec3 p = mix(aHome, aTarget, e);
                        p.y += sin(e * 3.14159) * 40.0 * h1(aSeed * 5.0);
                        p += vec3(sin(uTime * 0.8 + aSeed * 20.0), cos(uTime * 0.7 + aSeed * 13.0), sin(uTime * 0.6 + aSeed * 7.0)) * 3.0 * e;
                        vec3 col = aWarm > 0.5 ? vec3(1.0, 0.84, 0.55) : vec3(0.62, 0.92, 1.0);
                        // 比真的更亮、閃得更好看
                        float tw = 0.6 + 0.4 * sin(uTime * (3.0 + aSeed * 4.0) + aSeed * 50.0);
                        float al = 1.0 * tw * e;
                        al *= 1.0 - smoothstep(aLife, aLife + 2.0, age);
                        float sz = 5.2;
                        if (aDie > 0.0) {
                            float d = uTime - aDie;
                            vec3 dir = normalize(vec3(h1(aSeed * 11.0) - 0.5, h1(aSeed * 12.0) - 0.3, h1(aSeed * 13.0) - 0.5));
                            p += dir * d * 120.0;
                            al *= 1.0 - smoothstep(0.0, 0.7, d);
                            sz *= 1.0 + d;
                        }
                        vec4 mv = modelViewMatrix * vec4(p, 1.0);
                        gl_Position = projectionMatrix * mv;
                        gl_PointSize = clamp(sz * uPix * (190.0 / max(-mv.z, 1.0)), 1.0, 44.0);
                        vColor = col; vAlpha = al;
                    }`,
                fragmentShader: `
                    varying vec3 vColor; varying float vAlpha;
                    void main() {
                        float d = length(gl_PointCoord - vec2(0.5));
                        // 空心：只有一圈外殼
                        float ring = smoothstep(0.5, 0.42, d) * smoothstep(0.24, 0.36, d);
                        if (ring <= 0.0) discard;
                        gl_FragColor = vec4(vColor, ring * vAlpha);
                    }`,
                transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            }));
            G.points.frustumCulled = false;
            scene.add(G.points);

            // ---- 海底沉積：浪費留下的灰，一輪比一輪多 ----
            const dp = new Float32Array(D * 3), di = new Float32Array(D);
            for (let i = 0; i < D; i++) {
                const r = 650 * Math.pow(Math.random(), 0.6), th = Math.random() * Math.PI * 2;
                dp[i * 3] = Math.cos(th) * r; dp[i * 3 + 1] = SEABED + Math.random() * 2; dp[i * 3 + 2] = Math.sin(th) * r;
                di[i] = Math.random();
            }
            const dg = new THREE.BufferGeometry();
            dg.setAttribute('position', new THREE.BufferAttribute(dp, 3));
            dg.setAttribute('aIdx', new THREE.BufferAttribute(di, 1));
            const dustPts = new THREE.Points(dg, new THREE.ShaderMaterial({
                uniforms: { uPix: uniforms.uPix, uDustAmt: uniforms.uDustAmt },
                vertexShader: `
                    uniform float uPix, uDustAmt;
                    attribute float aIdx;
                    varying float vAlpha;
                    void main() {
                        vec4 mv = modelViewMatrix * vec4(position, 1.0);
                        gl_Position = projectionMatrix * mv;
                        gl_PointSize = clamp(2.6 * uPix * (300.0 / max(-mv.z, 1.0)), 1.0, 20.0);
                        vAlpha = aIdx < uDustAmt ? 0.32 * (1.0 - smoothstep(700.0, 1400.0, -mv.z)) : 0.0;
                    }`,
                fragmentShader: `
                    varying float vAlpha;
                    void main() {
                        float d = length(gl_PointCoord - vec2(0.5));
                        if (d > 0.5 || vAlpha <= 0.0) discard;
                        gl_FragColor = vec4(vec3(0.36, 0.34, 0.33), smoothstep(0.5, 0.1, d) * vAlpha);
                    }`,
                transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            }));
            dustPts.frustumCulled = false;
            scene.add(dustPts);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // 水位下降多少，就從水面依序取走多少顆
        function consume(now, dt) {
            const target = Math.min(N, Math.floor((1 - S.level) * N));
            if (target <= S.ptr) return;
            const measuring = S.mode === 'measure';
            const arr = measuring ? orderM : order;
            for (; S.ptr < target; S.ptr++) {
                const i = arr[S.ptr];
                spent[i] = now - Math.random() * dt;
                if (measuring) {
                    // 急躁取來的：到了目的地也組不成什麼，散落成塵
                    fate[i] = S.impatient ? 1 : 0;
                    aim[i * 3] = aimPt.x; aim[i * 3 + 1] = aimPt.y; aim[i * 3 + 2] = aimPt.z;
                    aimW[i] = S.impatient ? 0.15 : 0.9;
                    S.value += S.impatient ? 0.15 : efficiency(MEASURE_RATE / BASE_RATE);
                    if (!S.impatient) S.work.push(i);
                }
            }
            if (measuring) {
                // 一直取、不停下來消化：最早取來、還沒沉澱的，會被擠出去
                const cap = Math.floor(WORK_CAP * N);
                let forgot = 0;
                while (S.work.length > cap) {
                    const j = S.work.shift();
                    mem[j] = -now;
                    S.value -= efficiency(MEASURE_RATE / BASE_RATE);
                    forgot++;
                }
                if (forgot) {
                    memAttr.needsUpdate = true;
                    S.stats.forgot = (S.stats.forgot || 0) + forgot;
                    if (audioOK && now - S.forgetT > 0.5) { S.forgetT = now; A.bells.triggerAttackRelease(eerieNote('A#3'), '4n', Tone.now(), 0.25); }
                }
            }
            spentAttr.needsUpdate = true;
            if (measuring) { fateAttr.needsUpdate = true; aimAttr.needsUpdate = true; aimWAttr.needsUpdate = true; }
        }

        // ---------- 文字 ----------
        let curKey = null, textTimer = null;
        function setText(key) {
            if (key === curKey) return;
            curKey = key;
            const d = TEXT[key];
            const box = $('inst-fade');
            box.classList.add('out');
            clearTimeout(textTimer);
            textTimer = setTimeout(() => {
                $('inst-zh').textContent = d.i[0];
                $('inst-en').textContent = d.i[1];
                $('poem-zh').textContent = d.p ? d.p[0] : '';
                $('poem-en').textContent = d.p ? d.p[1] : '';
                if (d.i[0]) box.classList.remove('out');
            }, 600);
        }

        function flash(strength = 1, fade = 1.5) {
            const f = $('flash');
            f.style.transition = 'none';
            f.style.opacity = strength;
            requestAnimationFrame(() => requestAnimationFrame(() => {
                f.style.transition = `opacity ${fade}s ease-out`;
                f.style.opacity = 0;
            }));
        }

        function setBar(v, color) {
            const b = $('ui-bar');
            b.style.width = (Math.max(0, Math.min(1, v)) * 100) + '%';
            b.style.background = color; b.style.color = color;
        }

        function setVal(id, text, cls) {
            const el = $(id);
            if (el.textContent !== text) el.textContent = text;
            el.className = 'v' + (cls ? ' ' + cls : '');
        }

        // ---------- 轉場 ----------
        function collapse(now) {
            S.mode = 'collapse'; S.modeT = 0; S.gateHold = 0;
            S.stats.feastEnd = now;
            S.stats.feastValue = S.value;
            flash(0.75, 3.5);
            setText('dead');
            S.restore = 0; S.bellT = 0;
            if (audioOK) {
                A.roarGain.gain.cancelScheduledValues(Tone.now());
                A.roarGain.gain.rampTo(0, 0.25);
                A.lakeGain.gain.rampTo(0, 0.4);
                A.whisperGain.gain.rampTo(0.002, 0.6);
                A.glassGain.gain.rampTo(0.003, 0.6);
                A.padGain.gain.rampTo(0.025, 0.5);
                padTo(41, 2);
                A.boom.triggerAttackRelease('A0', '1n');
            }
        }

        // 凍結灰燼此刻的位置，作為倒帶的起點（與畫面無縫銜接）
        function startRewind(now) {
            uniforms.uFreeze.value = now;
            uniforms.uMode.value = 1;
            dissolveAllGhosts(now);
        }

        function startFeast() {
            S.mode = 'feast'; S.modeT = 0;
            S.pressing = false;   // 醒來時按著的那一下不算
            uniforms.uWake.value = 1;
            setText('intro');
            $('hud').style.opacity = 1; $('ui-progress').style.opacity = 1;
            if (audioOK) { A.lakeGain.gain.rampTo(0.05, 1.5); A.padGain.gain.rampTo(0.07, 1.5); }
        }

        // ---------- 幻覺 ----------
        function spawnGhost(now, hx, hz) {
            const i = S.gNext; S.gNext = (S.gNext + 1) % H;
            if (G.counted[i]) S.fakeValue -= 0.9;
            G.birth[i] = now; G.die[i] = -1;
            G.life[i] = 5 + Math.random() * 6;
            G.home[i * 3] = hx + (Math.random() - 0.5) * 90;
            G.home[i * 3 + 1] = SEABED;
            G.home[i * 3 + 2] = hz + (Math.random() - 0.5) * 90;
            G.counted[i] = 1;
            S.fakeValue += 0.9;
            S.halluSpent += 1;
            G.dirty = true;
        }

        function dissolveAllGhosts(now) {
            for (let i = 0; i < H; i++) if (G.birth[i] >= 0 && G.die[i] < 0) { G.die[i] = now; G.counted[i] = 0; }
            S.fakeValue = 0;
            G.dirty = true;
        }

        function updateHallucination(now, dt) {
            S.halluWin += dt;
            setText('hallu');
            $('inst').style.opacity = S.pressing ? 0.3 : 1;
            if (S.pressing) {
                S.halluT += dt;
                raycaster.setFromCamera({ x: S.mouseX, y: S.mouseY }, camera);
                let hx = 0, hz = -100;
                if (raycaster.ray.intersectPlane(seabedPlane, aimHit)) {
                    hx = Math.max(-420, Math.min(420, aimHit.x));
                    hz = Math.max(-500, Math.min(250, aimHit.z));
                }
                S.spawnAcc += dt * HALLU_RATE;
                while (S.spawnAcc >= 1) { S.spawnAcc -= 1; spawnGhost(now, hx, hz); }
                S.sparkT -= dt;
                if (audioOK && S.sparkT <= 0) {
                    S.sparkT = 0.1 + Math.random() * 0.15;
                    const sweet = ['C6', 'E6', 'G6', 'B6', 'D7'];
                    A.bells.triggerAttackRelease(eerieNote(sweet[Math.floor(Math.random() * sweet.length)]), '16n', Tone.now(), 0.18);
                }
            }
            if (S.halluT >= 6 || S.halluWin > 16) S.halluDone = true;
        }

        // 每一幀：到期的消失；游標碰到的被戳破
        function updateGhosts(now) {
            if (!G.points) return;
            raycaster.setFromCamera({ x: S.mouseX, y: S.mouseY }, camera);
            let popped = 0;
            for (let i = 0; i < H; i++) {
                const b = G.birth[i];
                if (b < 0) continue;
                const age = now - b;
                if (G.die[i] >= 0) {
                    if (now - G.die[i] > 1) { G.birth[i] = -1; G.dirty = true; }
                    continue;
                }
                if (age > G.life[i] + 2) {
                    G.birth[i] = -1; G.dirty = true;
                    if (G.counted[i]) { G.counted[i] = 0; S.fakeValue -= 0.9; }
                    continue;
                }
                if (age < 0.8) continue;
                const e = smooth(age / (1.2 + G.seed[i] * 1.2));
                gv.set(
                    G.home[i * 3] + (G.target[i * 3] - G.home[i * 3]) * e,
                    G.home[i * 3 + 1] + (G.target[i * 3 + 1] - G.home[i * 3 + 1]) * e,
                    G.home[i * 3 + 2] + (G.target[i * 3 + 2] - G.home[i * 3 + 2]) * e
                );
                if (raycaster.ray.distanceToPoint(gv) < 30) {
                    G.die[i] = now; G.dirty = true; popped++;
                    if (G.counted[i]) { G.counted[i] = 0; S.fakeValue -= 0.9; }
                }
            }
            S.fakeValue = Math.max(0, S.fakeValue);
            if (popped && audioOK && now - S.puffT > 0.08) { S.puffT = now; A.puff.triggerAttackRelease('16n'); }
            if (G.dirty) {
                G.aBirth.needsUpdate = true; G.aDie.needsUpdate = true; G.aLife.needsUpdate = true; G.aHome.needsUpdate = true;
                G.dirty = false;
            }
        }

        // 停下來兩秒：還在工作記憶裡的，全部沉澱
        function consolidate(now) {
            for (const j of S.work) mem[j] = now;
            S.work = [];
            memAttr.needsUpdate = true;
            if (audioOK) ['D4', 'A4'].forEach((n, i) => A.bells.triggerAttackRelease(eerieNote(n), '2n', Tone.now() + i * 0.15, 0.2));
        }

        // ↻：從被改變過的海，開始下一輪
        function restartRound() {
            S.round++;
            S.legacy = S.legacyNext; S.dustAmt = S.dustNext;
            Object.assign(S, {
                mode: 'feast', level: 1, pressing: false, holdT: 0, runaway: false, heat: 0, rate: 0, modeT: 0, ptr: 0,
                batchDrawn: 0, breaker: 'armed', cooldown: 0, bellT: 0, finishT: -1, value: 0, patience: 0, impatient: false,
                restore: 0, promptAt: 0, halluDone: false, halluT: 0, halluWin: 0, fakeValue: 0, halluSpent: 0, spawnAcc: 0,
                work: [], idleT: 0, fin: {}
            });
            S.stats = { feastValue: 0, feastStart: -1, feastDur: 0, feastEnd: 0, autoBurn: 0, batches: 0, trips: 0, kept: 0 };
            spent.fill(-1); fate.fill(0); mem.fill(0); aimW.fill(0);
            [spentAttr, fateAttr, memAttr, aimWAttr].forEach(a => a.needsUpdate = true);
            G.birth.fill(-1); G.die.fill(-1); G.counted.fill(0); G.dirty = true;
            Object.assign(uniforms, {});
            uniforms.uMode.value = 0; uniforms.uRestore.value = 0; uniforms.uGhost.value = 0; uniforms.uDim.value = 1;
            uniforms.uSettle.value = 0; uniforms.uLegacy.value = S.legacy; uniforms.uDustAmt.value = S.dustAmt;
            ['fin-cap', 'fin-unb', 'fin-bnd', 'again'].forEach(id => $(id).classList.remove('show'));
            ['fin-us', 'fin-ub', 'fin-bs', 'fin-bb'].forEach(id => $(id).style.width = '0');
            $('fin-uv').textContent = '0'; $('fin-bv').textContent = '0';
            $('center-text').style.opacity = 1; $('hud').style.opacity = 1; $('ui-progress').style.opacity = 1;
            curKey = null; setText('intro');
            ringScale = 0.3;
            if (audioOK) {
                A.lakeGain.gain.rampTo(0.05, 2); A.padGain.gain.rampTo(0.07, 2); padTo(55, 2);
                A.whisperGain.gain.rampTo(0.02, 2); A.glassGain.gain.rampTo(0.008, 2);
            }
        }

        function startMeasure() {
            S.value = 0; S.patience = 0; S.impatient = false; S.releaseAt = -10; S.taps = [];
            S.work = []; S.idleT = 0; mem.fill(0); memAttr.needsUpdate = true;
            fate.fill(0); fateAttr.needsUpdate = true;
            spent.fill(-1); spentAttr.needsUpdate = true;
            S.ptr = 0; S.level = 1; S.heat = 0; S.batchDrawn = 0; S.breaker = 'armed';
            uniforms.uMode.value = 2; uniforms.uRestore.value = 0;
            S.mode = 'measure'; S.modeT = 0;
            ringScale = 0.3;
            setText('m0');
            if (audioOK) ['C4', 'F#4', 'B4'].forEach((n, i) => A.bells.triggerAttackRelease(eerieNote(n), '1n', Tone.now() + i * 0.3, 0.4));
        }

        function startLedger(now) {
            S.mode = 'ledger'; S.ledgerStart = now; S.fin = {};
            // 這一輪會留下什麼給下一輪：有用的讓海更亮，浪費的沉在海底
            S.legacyNext = Math.min(1, S.legacy + (S.value / (N * STAR_FRAC)) * 0.35);
            S.dustNext = Math.min(1, S.dustAmt + (1 - S.stats.feastValue / N) * 0.4);
            $('center-text').style.opacity = 0;
            $('ui-progress').style.opacity = 0;
            $('hud').style.opacity = 0;
            if (audioOK) {
                [A.lakeGain, A.padGain, A.whisperGain, A.glassGain].forEach(g => g.gain.rampTo(0, 1.2));
            }
        }

        const smooth = x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };

        // 結尾：暗下 → 幻影（無界：全部燒成灰）→ 靜默 → 重新聚合（有界：留下來的）
        function updateFinale(now) {
            const t = now - S.ledgerStart, F = S.fin;
            let dim = 1, ghost = 0;
            if (t < 1.4) {
                dim = 1 - 0.85 * smooth(t / 1.4);
            } else if (t < 4.6) {
                if (!F.b1) {
                    F.b1 = true;
                    $('fin-cap').classList.add('show');
                    $('fin-unb').classList.add('show');
                    $('fin-ut').textContent = '/ ' + N.toLocaleString() + '';
                    setTimeout(() => {
                        $('fin-us').style.width = '100%';
                        $('fin-ub').style.width = Math.max(0.4, S.stats.feastValue / N * 100) + '%';
                    }, 300);
                    flash(0.18, 0.8);
                    if (audioOK) {
                        const t0 = Tone.now();
                        A.roarFilter.frequency.rampTo(2400, 0.1);
                        A.roarGain.gain.cancelScheduledValues(t0);
                        A.roarGain.gain.setValueAtTime(0.0001, t0);
                        A.roarGain.gain.linearRampToValueAtTime(0.5, t0 + 0.08);
                        A.roarGain.gain.linearRampToValueAtTime(0, t0 + 2.8);
                        A.boom.triggerAttackRelease('A0', '1n');
                    }
                }
                $('fin-uv').textContent = Math.round(S.stats.feastValue * smooth((t - 1.6) / 1.6)).toLocaleString();
                const k = (t - 1.4) / 3.2;
                dim = 0.15 + 0.75 * smooth(k * 3);
                ghost = smooth(k * 1.3);
                S.heat = 0.75 * Math.max(0, 1 - k * 1.6);
            } else if (t < 5.6) {
                ghost = 1; S.heat = 0;
                dim = 0.9 - 0.6 * smooth((t - 4.6) / 0.8);
            } else {
                if (!F.b2) {
                    F.b2 = true;
                    $('fin-bnd').classList.add('show');
                    $('fin-bt').textContent = '/ ' + S.ptr.toLocaleString() + '';
                    setTimeout(() => {
                        $('fin-bs').style.width = (S.ptr / N * 100) + '%';
                        $('fin-bb').style.width = (S.value / N * 100) + '%';
                    }, 300);
                    flash(0.55, 2.4);
                    if (audioOK) {
                        ['D3', 'A3', 'E4', 'B4', 'F#5', 'C#6'].forEach((n, i) => A.bells.triggerAttackRelease(n, '1n', Tone.now() + i * 0.09, 0.7));
                        padTo(110, 0.4);
                        A.padGain.gain.rampTo(0.09, 0.3);
                        A.lakeGain.gain.rampTo(0.04, 2.5);
                        A.glassGain.gain.rampTo(0.005, 3);
                    }
                }
                const k = t - 5.6;
                ghost = 1 - smooth(k / 1.6);
                dim = 1 + 0.7 * Math.exp(-k * 0.9) * smooth(k / 0.3);
                $('fin-bv').textContent = Math.round(S.value * smooth(k / 1.8)).toLocaleString();
                if (k > 3.5) {
                    // 留下的光落回海裡
                    if (!F.b3) {
                        F.b3 = true;
                        if (audioOK) { A.lakeGain.gain.rampTo(0.06, 4); ['A2', 'E3'].forEach((n, i) => A.bells.triggerAttackRelease(eerieNote(n), '1n', Tone.now() + i * 0.4, 0.3)); }
                    }
                    const st = smooth((k - 3.5) / 5);
                    uniforms.uSettle.value = st;
                    uniforms.uLegacy.value = S.legacy + (S.legacyNext - S.legacy) * st;
                    uniforms.uDustAmt.value = S.dustAmt + (S.dustNext - S.dustAmt) * st;
                }
                if (k > 9 && !F.b4) { F.b4 = true; $('again').classList.add('show'); }
            }
            uniforms.uDim.value = dim;
            uniforms.uGhost.value = ghost;
        }

        // ---------- 主迴圈 ----------
        let clock;
        const RED = '#ff3355', HOT = '#ff6a3d', CYAN = '#5ad2ff';

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            const now = clock.elapsedTime;

            if (S.mode === 'wake') {
                // 醒來：海是暗的，點一下亮一圈
                S.modeT += dt;
                if (S.wakeEnd < 0 && S.modeT > 14) S.wakeEnd = now;
                const w = S.wakeEnd < 0 ? 0 : smooth((now - S.wakeEnd) / 3.5);
                uniforms.uWake.value = w;
                setText('wake');
                setBar(Math.min(1, S.wakeTaps / 3), CYAN);
                if (w >= 1) startFeast();
            } else if (S.mode === 'feast') {
                if (S.pressing) {
                    if (S.stats.feastStart < 0) S.stats.feastStart = now;
                    S.holdT += dt;
                } else {
                    S.holdT = Math.max(0, S.holdT - dt * (S.runaway ? 0.3 : (frantic() ? 0.15 : 3)));
                }
                let rate = (S.pressing || frantic()) ? BASE_RATE + 0.009 * Math.pow(S.holdT, 1.7) : 0;
                if (S.level < 0.55 && !S.runaway) {
                    S.runaway = true;
                    flash(0.12, 1.2);
                    if (audioOK) A.boom.triggerAttackRelease('D1', '2n', Tone.now(), 0.6);
                }
                if (S.runaway) {
                    // 失控：不再需要你的手
                    const auto = 0.03 + 0.35 * (0.55 - S.level);
                    if (!S.pressing) S.stats.autoBurn += dt;
                    rate = Math.max(rate, auto);
                }
                S.rate = Math.min(rate, 0.4);
                S.value += Math.min(S.level, S.rate * dt) * N * (S.pressing ? efficiency(S.rate / BASE_RATE) : 0);
                if (S.stats.feastStart >= 0) S.stats.feastDur += dt;
                S.level = Math.max(0, S.level - S.rate * dt);
                S.heat += (Math.min(1, S.rate / 0.25) - S.heat) * Math.min(1, dt * 4);
                consume(now, dt);

                if (!S.runaway) setText(S.level > 0.9 ? 'intro' : S.level > 0.72 ? 'f1' : 'f2');
                else setText(S.level > 0.25 ? 'run' : 'run2');
                $('inst').style.opacity = (S.pressing && !S.runaway) ? 0.25 : 1;

                setBar(S.heat, S.heat > 0.6 ? RED : HOT);
                if (S.level <= 0) collapse(now);

            } else if (S.mode === 'collapse') {
                // 灰燼持續飄落；之後長按會把它一點一點拉回池中（鬆手則緩緩沉回去）
                S.modeT += dt;
                S.heat *= 0.9; S.rate = 0;
                updateGhosts(now);
                if (S.modeT > 4.5 && !S.halluDone) {
                    // 幻覺：海已經乾了，但你繼續要，它就繼續給
                    updateHallucination(now, dt);
                    setBar(Math.min(1, S.halluT / 6), '#ffd38a');
                } else if (S.halluDone) {
                    setText(S.restore > 0.05 ? 'rewind' : 'again');
                    $('inst').style.opacity = 1;
                    if (!S.promptAt) S.promptAt = nowS();
                    const fresh = S.pressing && S.pressAt >= S.promptAt;
                    if (fresh && uniforms.uMode.value === 0) startRewind(now);
                    if (uniforms.uMode.value === 1) {
                        S.restore = fresh ? S.restore + dt / 3.2 : Math.max(0, S.restore - dt * 0.12);
                        const r = Math.min(1, S.restore);
                        uniforms.uRestore.value = r;
                        S.level = r;
                        S.bellT -= dt;
                        if (audioOK && fresh && S.bellT <= 0) {
                            S.bellT = 0.42;
                            const n = ['A#5', 'G#5', 'F#5', 'E5', 'D5', 'C5', 'A#4', 'G#4'];
                            A.bells.triggerAttackRelease(eerieNote(n[Math.min(n.length - 1, Math.floor(r * n.length))]), '2n', Tone.now(), 0.35);
                        }
                        if (audioOK) {
                            A.lakeGain.gain.rampTo(0.05 * r, 0.15);
                            A.whisperGain.gain.rampTo(0.002 + 0.006 * r, 0.15);
                            A.padGain.gain.rampTo(0.025 + 0.04 * r, 0.15);
                            padTo(41 + 14 * r, 0.15);
                        }
                        if (r >= 1) startMeasure();
                    }
                    setBar(S.restore, CYAN);
                } else setBar(0, CYAN);

            } else if (S.mode === 'measure') {
                const floor = 1 - STAR_FRAC;
                const done = S.level <= floor + 1e-5;
                if (S.breaker === 'cooldown') {
                    S.cooldown -= dt;
                    if (S.cooldown <= 0) S.breaker = 'armed';
                }
                S.rate = 0;
                if (!done && S.pressing && (S.breaker === 'armed' || S.breaker === 'drawing')) {
                    if (S.breaker === 'armed') S.impatient = (S.pressAt - S.releaseAt < 0.8) || frantic();
                    S.breaker = 'drawing';
                    const d = Math.min(MEASURE_RATE * dt, QUOTA - S.batchDrawn, S.level - floor);
                    S.level -= d; S.batchDrawn += d; S.rate = MEASURE_RATE;
                    S.bellT -= dt;
                    if (audioOK && S.bellT <= 0) {
                        S.bellT = 0.08 + Math.random() * 0.35;
                        const prog = (1 - S.level) / STAR_FRAC;
                        if (S.impatient) A.bells.triggerAttackRelease(eerieNote(Math.random() < 0.5 ? 'C#4' : 'G4'), '8n', Tone.now(), 0.5);
                        else A.bells.triggerAttackRelease(eerieNote(WHOLE[Math.floor(Math.random() * WHOLE.length)]), '8n', Tone.now(), 0.3 + Math.random() * 0.3);
                    }
                    // 夠了就自己停：有耐心的時候，不必等到額度用完
                    const enough = !S.impatient && S.patience > 0.3 && S.batchDrawn >= QUOTA * (0.9 - 0.3 * S.patience);
                    if (enough) {
                        S.breaker = 'settled'; S.stats.batches++;
                        S.patience = Math.min(1, S.patience + 0.25);
                        if (audioOK) ['E5', 'B5'].forEach((n, i) => A.bells.triggerAttackRelease(eerieNote(n), '2n', Tone.now() + i * 0.12, 0.25));
                    } else if (S.batchDrawn >= QUOTA - 1e-6) {
                        // 熔斷：這一批到此為止
                        S.breaker = 'tripped'; S.stats.trips++; S.stats.batches++;
                        S.patience = S.impatient ? Math.max(0, S.patience - 0.5) : Math.min(1, S.patience + 0.3);
                        flash(0.08, 0.6);
                        if (audioOK) A.clunk.triggerAttackRelease('G1', '8n');
                    } else if (S.level <= floor + 1e-5) {
                        S.stats.batches++; S.breaker = 'done';
                    }
                }
                if (!S.pressing) {
                    if (S.breaker === 'drawing') {
                        // 自己在額度之前鬆手：最好的那種停
                        if (S.batchDrawn > 0.004) {
                            S.stats.batches++;
                            S.patience = S.impatient ? Math.max(0, S.patience - 0.3) : Math.min(1, S.patience + 0.3);
                        }
                        S.batchDrawn = 0; S.breaker = 'armed';
                    }
                    else if (S.breaker === 'tripped' || S.breaker === 'settled') { S.batchDrawn = 0; S.breaker = 'cooldown'; S.cooldown = 0.4; }
                }
                consume(now, dt);
                S.idleT = S.pressing ? 0 : S.idleT + dt;
                if (S.idleT > 2.0 && S.work.length) consolidate(now);

                const prog = (1 - S.level) / STAR_FRAC;
                if (S.level <= floor + 1e-5) {
                    setText('mDone');
                    if (S.finishT < 0) S.finishT = now;
                    if (now - S.finishT > 3.4) startLedger(now);
                } else if (S.breaker === 'tripped') setText('mTrip');
                else if (S.breaker === 'settled') setText('mSettle');
                else if (prog > 0.45) setText('mGrow');
                else if (S.breaker === 'drawing') setText('mDraw');
                else setText('m0');
                $('inst').style.opacity = (S.pressing && S.breaker === 'drawing') ? 0.3 : 1;

                setBar(S.breaker === 'tripped' ? 1 : S.batchDrawn / QUOTA, S.breaker === 'tripped' ? RED : (S.breaker === 'settled' ? '#ffd38a' : CYAN));

                // 注意力：游標或手指指向的位置（投影到場景中央的垂直面上）
                raycaster.setFromCamera({ x: S.mouseX, y: S.mouseY }, camera);
                if (raycaster.ray.intersectPlane(aimPlane, aimHit)) {
                    aimHit.x = Math.max(-280, Math.min(280, aimHit.x));
                    aimHit.y = Math.max(-10, Math.min(175, aimHit.y));
                    aimHit.z = 0;
                    aimPt.lerp(aimHit, 0.12);
                }
                halo.position.copy(aimPt);
                S.heat *= 0.9;
            } else if (S.mode === 'ledger') {
                updateFinale(now);
            }

            // HUD
            if (S.mode !== 'gate') {
                const burned = 1 - S.level;
                setVal('h-reserve', (S.level * 100).toFixed(1) + '%', S.mode === 'collapse' && S.level < 0.05 ? 'void' : (S.mode === 'feast' && S.level < 0.3 ? 'hot' : ''));
                const mult = S.rate / BASE_RATE;
                const capped = S.mode === 'measure' && S.rate > 0;
                setVal('h-rate', '×' + mult.toFixed(1) + (capped ? ' CAP' : ''), S.mode === 'feast' && mult > 8 ? 'hot' : '');
                const spentTok = S.mode === 'collapse' ? N + Math.round(S.halluSpent) : S.ptr;
                const shown = S.value + (S.mode === 'collapse' ? S.fakeValue : 0);
                const eff = spentTok > 0 ? shown / spentTok : 1;
                setVal('h-burned', spentTok.toLocaleString(), S.mode === 'feast' && S.ptr > N * 0.5 ? 'hot' : '');
                setVal('h-kept', Math.round(shown).toLocaleString() + (spentTok > 0 ? '  ' + Math.round(eff * 100) + '%' : ''),
                    S.fakeValue > 1 ? 'calm' : (spentTok > 0 ? (eff < 0.3 ? 'void' : (eff > 0.8 ? 'calm' : '')) : ''));
            }

            // 節流環
            const ringOn = S.mode === 'measure' || S.mode === 'ledger';
            // 越有耐心，環越淡；急躁時它會回來
            const alarmed = S.breaker === 'tripped' || (S.breaker === 'drawing' && S.impatient);
            const ringTarget = S.mode === 'measure' ? (alarmed ? 0.85 : 0.75 * (1 - 0.9 * S.patience)) : 0;
            if (halo) halo.material.opacity += ((S.mode === 'measure' ? (S.pressing ? 0.35 : 0.15) : 0) - halo.material.opacity) * 0.08;
            ring.material.opacity += (ringTarget - ring.material.opacity) * (alarmed ? 0.2 : 0.03);
            ringScale += (1 - ringScale) * 0.03;
            ticks.material.opacity = ring.material.opacity;
            if (ringOn) {
                const tripped = S.breaker === 'tripped';
                const blink = tripped ? (Math.sin(now * 30) > 0 ? 1 : 0.35) : 1;
                if (tripped) ring.material.color.setRGB(1, 0.2 * blink, 0.3 * blink);
                else if (S.breaker === 'drawing' && S.impatient) ring.material.color.setRGB(1, 0.55 + 0.3 * Math.sin(now * 40), 0.25);
                else if (S.breaker === 'drawing') ring.material.color.setRGB(0.6, 0.95, 1);
                else ring.material.color.setRGB(0.25, 0.7, 1);
                ring.scale.setScalar(ringScale * (S.breaker === 'drawing' ? 1 + Math.sin(now * 8) * 0.02 : (tripped ? 0.94 : 1)));
                ticks.scale.setScalar(ringScale);
                const lit = S.batchDrawn / QUOTA;
                const TICKS = tickColors.length / 6;
                for (let i = 0; i < TICKS; i++) {
                    const on = i / TICKS < lit;
                    const c = on ? (tripped ? [1, 0.2, 0.3] : [0.6, 0.95, 1]) : [0.08, 0.18, 0.25];
                    tickColors.set([...c, ...c], i * 6);
                }
                ticks.geometry.attributes.color.needsUpdate = true;
                ring.rotation.z = now * 0.1; ticks.rotation.y = -now * 0.1;
            }

            // 池底
            let gridO = 0;
            if (S.mode === 'feast') gridO = (1 - S.level) * 0.35;
